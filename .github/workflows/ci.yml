name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Los tests usan node:sqlite (Node >= 22.13) con las migraciones reales.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Comprobar que _headers llegó al build
        run: test -s dist/_headers
